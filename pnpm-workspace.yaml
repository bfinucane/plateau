# pnpm v11 reads its settings from here (the `pnpm` field in package.json and
# most .npmrc keys are no longer honoured in v11).
#
# nodeLinker: hoisted is REQUIRED in this environment. pnpm's default isolated
# linker creates each top-level package as a Windows directory junction into
# .pnpm/<pkg>/node_modules/<pkg>. Node's module resolver does not traverse
# junctions when walking up the directory tree (fs.realpathSync returns the
# junction path itself), so a package's own transitive dependencies resolve to
# nothing -- e.g. vite cannot find fdir/rollup/picomatch. A hoisted, flat
# node_modules materialises real directories and resolves correctly.
nodeLinker: hoisted

# esbuild ships a native binary and needs its install script to run.
allowBuilds:
  esbuild: true
